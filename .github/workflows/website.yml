name: Publish CIPHER website

on:
  push:
    branches: [main, cipher/booth-readiness]
    paths:
      - 'website/**'
      - 'scripts/build_site.py'
      - 'scripts/build_brand.py'
      - 'docs/presentation/**'
      - 'docs/brochure/**'
      - 'docs/showcase/plain-english-incidents.png'
      - 'docs/demo/CIPHER_demo.mp4'
      - 'docs/demo/incident-evidence.png'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Package public files and check links
        run: python3 scripts/build_site.py --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
